[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashcat-betting"
version = "0.1.0"
description = "Flashcat Betting — probability-blended sports betting research model"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.12",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
nfl = ["nfl_data_py>=0.3.2"]
dev = ["pytest>=8.0", "ruff>=0.5.0", "black>=24.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
